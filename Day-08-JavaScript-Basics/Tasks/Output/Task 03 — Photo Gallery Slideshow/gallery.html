<!doctype html>
<html>
  <head>
    <title>Photo Gallery</title>
  </head>
  <body style="text-align: center;">
    <h2>Photo Gallery</h2>

    <img
      id="gallery"
      src="https://picsum.photos/id/1015/500/300"
      alt="Gallery Image"
      style="width: 500px; height: 300px; border: 2px solid black"
    />

    <br />

    <button
      id="play"
      onclick="playGallery()"
      style="margin-top: 15px; padding: 10px 20px; font-size: 16px"
    >
      Play
    </button>

    <script>
      let images = [
        "https://picsum.photos/id/1015/500/300",
        "https://picsum.photos/id/1016/500/300",
        "https://picsum.photos/id/1018/500/300",
        "https://picsum.photos/id/1025/500/300",
        "https://picsum.photos/id/1035/500/300",
      ];

      let index = 0;
      let timer = null;

      function playGallery() {
        if (timer != null) return;

        timer = setInterval(function () {
          index++;

          if (index >= images.length) index = 0;

          document.getElementById("gallery").src = images[index];
        }, 1000);
      }

      document.getElementById("play").onclick = function () {
        playGallery();
      };
    </script>
  </body>
</html>
